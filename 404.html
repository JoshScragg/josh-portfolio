<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    var pathSegments = window.location.pathname.split('/');
    var repo = pathSegments[1];
    var path = '/' + pathSegments.slice(2).join('/');
    
    window.location.replace('/' + repo + '/?path=' + path);
  </script>
</head>
<body>
  <p>Redirecting to home page...</p>
</body>
</html>
