<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    var path = window.location.pathname;
    
    if (path !== '/' && path !== '') {
      window.location.replace('/?path=' + path);
    }
  </script>
</head>
<body>
  <p>Redirecting to home page...</p>
</body>
</html>
